name: Track KMIC fuel prices
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 8 AM CDT / 7 AM CST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node track.js
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
      - name: Commit price log
        run: |
          git config user.name "fuel-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "KMIC fuel prices $(date -u +%F)"
          git push
